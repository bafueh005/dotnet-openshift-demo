apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dotnet-openshift-demo
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/bafueh005/dotnet-openshift-demo.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: dotnet-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  # The OpenShift image-trigger controller overwrites the container image to
  # the resolved ImageStreamTag digest. The post-build script writes a fresh
  # checksum onto the pod template annotations. Both are runtime concerns,
  # not source-of-truth — ArgoCD should not fight them.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/spec/containers/0/image
        - /spec/template/metadata/annotations/app.kubernetes.io~1build-info-checksum
        - /metadata/annotations/image.openshift.io~1triggers
    - group: ""
      kind: ConfigMap
      name: app-build-info
      jsonPointers:
        - /data
