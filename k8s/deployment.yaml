apiVersion: apps/v1
kind: Deployment
metadata:
  name: dotnet-openshift-demo
  namespace: dotnet-demo
  labels:
    app: dotnet-openshift-demo
  annotations:
    image.openshift.io/triggers: |
      [{"from":{"kind":"ImageStreamTag","name":"dotnet-openshift-demo:latest","namespace":"dotnet-demo"},"fieldPath":"spec.template.spec.containers[?(@.name==\"app\")].image","pause":"false"}]
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dotnet-openshift-demo
  template:
    metadata:
      labels:
        app: dotnet-openshift-demo
      annotations:
        app.kubernetes.io/build-info-checksum: bootstrap
    spec:
      containers:
        - name: app
          image: image-registry.openshift-image-registry.svc:5000/dotnet-demo/dotnet-openshift-demo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-build-info
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
